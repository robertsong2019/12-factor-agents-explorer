[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-graph"
version = "1.0.0"
description = "Lightweight knowledge graph for AI agent long-term memory, powered by SQLite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Catalyst", email = "catalyst@openclaw.dev"},
]
keywords = ["knowledge-graph", "agent", "memory", "sqlite", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/robertsong2019/agent-memory-graph"

[tool.setuptools]
py-modules = ["memory_graph"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
